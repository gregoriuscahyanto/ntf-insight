name: Windows Release – Setup und Wheel

# Ausschliesslich manuell, niemals auf privaten Daten-Runnern.
on:
  workflow_dispatch:
    inputs:
      paket:
        description: "Welche Installationspakete veröffentlichen?"
        required: true
        default: beide
        type: choice
        options:
          - beide
          - setup
          - wheel

permissions:
  contents: write

concurrency:
  group: ntf-insight-windows-release
  cancel-in-progress: false

jobs:
  windows-release:
    if: github.repository == 'gregoriuscahyanto/ntf-insight' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Repository ohne persistente Tokens laden
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Python 3.11 für den Build einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Build- und Testwerkzeuge installieren
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip-Upgrade fehlgeschlagen." }
          python -m pip install -e ".[dev]" build
          if ($LASTEXITCODE -ne 0) { throw "Python-Abhaengigkeiten fehlen." }

      - name: Release-Version und vorhandene Assets prüfen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PAKET: ${{ inputs.paket }}
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw "Ungueltige Versionsnummer" }
          $tag = "v$version"
          $json = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName
          if ($LASTEXITCODE -ne 0) { throw "Releases konnten nicht abgefragt werden." }
          $tags = @($json | ConvertFrom-Json | ForEach-Object { $_.tagName })
          if ($tags -contains $tag) {
            $tagSha = (git rev-list -n 1 $tag).Trim()
            if ($LASTEXITCODE -ne 0 -or $tagSha -ne $env:GITHUB_SHA) {
              throw "Release $tag stammt nicht vom aktuellen Commit. Versionsnummer erhoehen."
            }
            $assetsJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets
            if ($LASTEXITCODE -ne 0) { throw "Release-Assets konnten nicht abgefragt werden." }
            $names = @($assetsJson | ConvertFrom-Json | Select-Object -ExpandProperty assets | ForEach-Object { $_.name })
            if ($env:PAKET -ne 'wheel' -and ($names -contains "NTF-Insight-Setup-$version.exe")) {
              throw "Setup fuer $tag existiert bereits. Nicht ueberschreiben; Versionsnummer erhoehen."
            }
            if ($env:PAKET -ne 'setup' -and ($names -contains "NTF-Insight-Wheel-Offline-$version-Windows-x64-Python311.zip")) {
              throw "Wheel-Offline-Paket fuer $tag existiert bereits."
            }
            if ($env:PAKET -ne 'setup' -and ($names -contains "ntf_insight-$version-py3-none-any.whl")) {
              throw "Wheel bereits manuell hochgeladen. Offline-ZIP bitte lokal erstellen und manuell hinzufuegen, oder eine neue Version freigeben."
            }
          }

      - name: Qualitätstests und GUI-Smoke-Test
        shell: pwsh
        run: |
          python ci/quality_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Qualitaetstests fehlgeschlagen." }

      - name: Wheel bauen
        if: inputs.paket != 'setup'
        shell: pwsh
        run: |
          python -m build --wheel
          if ($LASTEXITCODE -ne 0) { throw "Wheel-Build fehlgeschlagen." }
          $wheels = @(Get-ChildItem -Path "dist\ntf_insight-*.whl" -File)
          if ($wheels.Count -ne 1) { throw "Erwartet wurde genau ein NTF-Insight-Wheel." }
          .\scripts\baue_offline_wheel_paket.ps1 -WheelPfad $wheels[0].FullName -Python "python"
          if (-not $?) { throw "Wheel-Offline-Paket konnte nicht erstellt werden." }

      - name: Wheel-Offline-Installation prüfen
        if: inputs.paket != 'setup'
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          $zip = Join-Path (Get-Location) "dist\offline\NTF-Insight-Wheel-Offline-$version-Windows-x64-Python311.zip"
          $entpackt = Join-Path $env:RUNNER_TEMP "NTF-Insight-Wheel-Test"
          Expand-Archive -LiteralPath $zip -DestinationPath $entpackt -Force
          $installation = Join-Path $env:RUNNER_TEMP "NTF-Insight-Wheel-Installation"
          $env:NTF_INSIGHT_PYTHON311 = (Get-Command python).Source
          & (Join-Path $entpackt "installiere_offline.ps1") -Installationsordner $installation -KeineVerknuepfungen
          if (-not $?) { throw "Wheel-Offline-Installation fehlgeschlagen." }
          $exe = Join-Path $installation "venv\Scripts\python.exe"
          & $exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Offline-Abhaengigkeiten unvollstaendig." }
          $env:NTF_INSIGHT_SMOKE_TEST = "1"
          $env:NTF_INSIGHT_DATA_DIR = Join-Path $env:RUNNER_TEMP "ntf-insight-wheel-testdaten"
          $app = Start-Process -FilePath $exe -ArgumentList "-m ntf_insight" -PassThru
          if (-not $app.WaitForExit(60000)) {
            Stop-Process -Id $app.Id -Force
            throw "Wheel-GUI hat das Zeitlimit beim Starttest ueberschritten."
          }
          if ($app.ExitCode -ne 0) { throw "Wheel-GUI startet nicht." }
          if (-not (Test-Path (Join-Path $env:NTF_INSIGHT_DATA_DIR "logs\ntf-insight.log"))) {
            throw "Der Wheel-GUI-Start wurde nicht protokolliert."
          }

      - name: PyInstaller installieren
        if: inputs.paket != 'wheel'
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller-Installation fehlgeschlagen." }

      - name: Inno Setup sicherstellen
        if: inputs.paket != 'wheel'
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup konnte nicht installiert werden." }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nicht gefunden." }

      - name: Windows-Setup bauen
        if: inputs.paket != 'wheel'
        shell: pwsh
        run: |
          .\scripts\baue_windows_setup.ps1 -Python "python"
          if (-not $?) { throw "Windows-Setup konnte nicht erstellt werden." }

      - name: Windows-Setup installieren und GUI starten
        if: inputs.paket != 'wheel'
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          $setup = Join-Path (Get-Location) "dist\installer\NTF-Insight-Setup-$version.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "NTF-Insight-Testinstallation"
          $installArguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installDir`""
          $installer = Start-Process -FilePath $setup -ArgumentList $installArguments -PassThru
          if (-not $installer.WaitForExit(180000)) {
            Stop-Process -Id $installer.Id -Force
            throw "Setup-Installation hat das Zeitlimit ueberschritten."
          }
          if ($installer.ExitCode -ne 0) { throw "Setup-Installation fehlgeschlagen." }
          $exe = Join-Path $installDir "NTF Insight.exe"
          if (-not (Test-Path $exe)) { throw "Installierte GUI fehlt." }
          $env:NTF_INSIGHT_SMOKE_TEST = "1"
          $env:NTF_INSIGHT_DATA_DIR = Join-Path $env:RUNNER_TEMP "ntf-insight-setup-testdaten"
          $app = Start-Process -FilePath $exe -PassThru
          if (-not $app.WaitForExit(60000)) {
            Stop-Process -Id $app.Id -Force
            throw "Setup-GUI hat das Zeitlimit beim Starttest ueberschritten."
          }
          if ($app.ExitCode -ne 0) { throw "Setup-GUI startet nicht." }
          if (-not (Test-Path (Join-Path $env:NTF_INSIGHT_DATA_DIR "logs\ntf-insight.log"))) {
            throw "Der GUI-Start wurde nicht dokumentiert."
          }

      - name: Dateien zu GitHub Release hinzufügen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PAKET: ${{ inputs.paket }}
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Versionsnummer nicht verfuegbar." }
          $tag = "v$version"
          $dateien = [Collections.Generic.List[string]]::new()
          if ($env:PAKET -ne 'wheel') {
            $dateien.Add("dist/installer/NTF-Insight-Setup-$version.exe")
            $dateien.Add("dist/installer/SHA256SUMS.txt")
          }
          if ($env:PAKET -ne 'setup') {
            $dateien.Add("dist/ntf_insight-$version-py3-none-any.whl")
            $dateien.Add("dist/offline/NTF-Insight-Wheel-Offline-$version-Windows-x64-Python311.zip")
            $dateien.Add("dist/offline/SHA256SUMS-WHEEL.txt")
          }
          foreach ($datei in $dateien) {
            if (-not (Test-Path -LiteralPath $datei -PathType Leaf)) {
              throw "Release-Datei fehlt: $datei"
            }
          }
          $json = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName
          if ($LASTEXITCODE -ne 0) { throw "Releases konnten nicht abgefragt werden." }
          $tags = @($json | ConvertFrom-Json | ForEach-Object { $_.tagName })
          if ($tags -contains $tag) {
            gh release upload $tag @dateien --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag @dateien --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "NTF Insight $tag – Windows" --notes "NTF Insight: Windows-Setup ohne Python oder Wheel-Offline-Paket mit Python 3.11. Installationsanleitung siehe README. Testversion ohne Unternehmenssignatur." --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release konnte nicht aktualisiert werden." }
