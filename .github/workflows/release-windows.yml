name: Windows Setup und Release

# Bewusst manuell: kein Build auf privaten, selbstgehosteten Daten-Runnern.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ntf-insight-windows-release
  cancel-in-progress: false

jobs:
  windows-setup:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python für den Build einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Abhängigkeiten und PyInstaller installieren
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller==6.22.3

      - name: Versionsnummer und bestehenden Release prüfen
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Ungueltige Versionsnummer" }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag existiert bereits. Zuerst Versionsnummer erhoehen." }

      - name: Code und GUI testen
        shell: pwsh
        run: python ci/quality_gate.py

      - name: Inno Setup sicherstellen
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup konnte nicht installiert werden." }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe wurde nicht gefunden." }

      - name: Eigenständiges Setup erstellen
        shell: pwsh
        run: .\scripts\baue_windows_setup.ps1 -Python "python"

      - name: Setup installieren und installierte GUI starten
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          $setup = Join-Path (Get-Location) "dist\installer\NTF-Insight-Setup-$version.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "NTF-Insight-Testinstallation"
          $installArguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installDir`""
          $installer = Start-Process -FilePath $setup -ArgumentList $installArguments -PassThru
          if (-not $installer.WaitForExit(180000)) {
            Stop-Process -Id $installer.Id -Force
            throw "Setup-Installation hat das Zeitlimit überschritten."
          }
          if ($installer.ExitCode -ne 0) { throw "Setup-Installation fehlgeschlagen: $($installer.ExitCode)" }
          $exe = Join-Path $installDir "NTF Insight.exe"
          if (-not (Test-Path $exe)) { throw "Installierte GUI fehlt." }
          $env:NTF_INSIGHT_SMOKE_TEST = "1"
          $env:NTF_INSIGHT_DATA_DIR = Join-Path $env:RUNNER_TEMP "ntf-insight-testdaten"
          $app = Start-Process -FilePath $exe -PassThru
          if (-not $app.WaitForExit(60000)) {
            Stop-Process -Id $app.Id -Force
            throw "Die installierte GUI hat das Zeitlimit beim Starttest überschritten."
          }
          if ($app.ExitCode -ne 0) { throw "Die installierte GUI startet nicht: $($app.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:NTF_INSIGHT_DATA_DIR "logs\ntf-insight.log"))) {
            throw "Der GUI-Start wurde nicht im Log dokumentiert."
          }

      - name: GitHub Release mit Setup und Prüfsumme erstellen
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          $tag = "v$version"
          $setup = "dist/installer/NTF-Insight-Setup-$version.exe"
          $sum = "dist/installer/SHA256SUMS.txt"
          if (-not (Test-Path $setup) -or -not (Test-Path $sum)) { throw "Release-Dateien fehlen." }
          gh release create $tag $setup $sum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "NTF Insight $tag – Windows" --notes "NTF Insight für Windows 64 Bit. Setup herunterladen, übertragen und per Doppelklick installieren. Keine separate Python-Installation notwendig. Vorabversion, derzeit nicht unternehmenssigniert." --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release konnte nicht veröffentlicht werden." }
