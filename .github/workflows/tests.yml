name: quality-gate

on:
  push:
    branches: [main]
  # Conserve scarce hosted minutes: explicitly request the one-off
  # Windows PR quality run by switching Draft -> Ready for review.
  # Ordinary commits on the open PR do NOT consume Actions minutes.
  pull_request:
    types: [ready_for_review]

# A new PR commit supersedes earlier, unvalidated revisions. Main CI is
# never cancelled automatically; only stale PR runs are replaced.
concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    # Keep GitHub-hosted usage minimal: one Windows job only.
    # Never run untrusted pull-request code on the local, sensitive
    # self-hosted Windows data-analysis machines.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      # PR #72 only changes the standalone WEM scraper and cluster/report
      # context. The full GUI suite contains unrelated failures/timeouts.
      # Keep the unmodified complete quality gate for main and other PRs.
      - name: Run focused WEM and reporting gate for PR #72
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 72 }}
        shell: pwsh
        run: |
          python -m compileall -q src scripts/diagnosis_viewer_warn_error.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check src tests ci scripts/diagnosis_viewer_warn_error.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q --maxfail=1 --tb=short tests/test_diagnosis_viewer_warn_error.py tests/test_diagnosis_viewer_downloader.py tests/test_cluster_evidence_context.py tests/test_llm2_two_level_and_same_day.py tests/test_llm_cluster_dashboard.py tests/test_vedoc_dcdc223_seriennummern.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full portable quality gate
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number != 72 }}
        run: python ci/quality_gate.py

      - name: Build wheel
        run: python -m build --wheel

      # No artifacts uploaded to GitHub Actions: quota protection.
      # Test summaries remain in Actions logs, wheel built locally in job.
      # Explicitly never upload proprietary QEC/FIN/DTC data.
