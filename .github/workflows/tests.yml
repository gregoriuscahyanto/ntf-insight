name: quality-gate

on:
  push:
    branches: [main]
  # Conserve scarce hosted minutes: explicitly request the one-off
  # Windows PR quality run by switching Draft -> Ready for review.
  # Ordinary commits on the open PR do NOT consume Actions minutes.
  pull_request:
    types: [ready_for_review]

# A new PR commit supersedes earlier, unvalidated revisions. Main CI is
# never cancelled automatically; only stale PR runs are replaced.
concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    # Keep GitHub-hosted usage minimal: one Windows job only.
    # Never run untrusted pull-request code on the local, sensitive
    # self-hosted Windows data-analysis machines.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      # PR #73 modifies VeDoc SSO only. Its previous full run exposed
      # unrelated GUI failures and a blocking native file dialog.
      # Keep the regular full quality gate for every other PR and for main.
      - name: Run focused VeDoc gate for PR #73
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 73 }}
        shell: pwsh
        run: |
          python -m compileall -q src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check src tests ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q --maxfail=1 --tb=short tests/test_vedoc_codes_scraper.py tests/test_vedoc_dcdc223_seriennummern.py tests/test_diagnosis_viewer_downloader.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # PR #72 changes the WEM scraper and reporting context.
      # Use only the directly affected offline/regression test modules.
      - name: Run focused WEM and reporting gate for PR #72
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 72 }}
        shell: pwsh
        run: |
          python -m compileall -q src scripts/diagnosis_viewer_warn_error.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check src tests ci scripts/diagnosis_viewer_warn_error.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q --maxfail=1 --tb=short tests/test_diagnosis_viewer_warn_error.py tests/test_diagnosis_viewer_downloader.py tests/test_cluster_evidence_context.py tests/test_llm2_two_level_and_same_day.py tests/test_llm_cluster_dashboard.py tests/test_vedoc_dcdc223_seriennummern.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # PR #74 fuegt nur eine CLI fuer den bestehenden QuickTest-Downloader hinzu.
      # Der komplette GUI-Gate haengt bereits auf main an einem nativen Qt-Dialog.
      # Daher hier gezielt die CLI, das Downloader-Backend und den GUI-Einstieg testen.
      - name: Run focused QuickTest-CLI gate for PR #74
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 74 }}
        shell: pwsh
        run: |
          python -m compileall -q src scripts/diagnosis_viewer_quicktests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check src tests ci scripts/diagnosis_viewer_quicktests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q --maxfail=1 --tb=short tests/test_diagnosis_viewer_quicktests_cli.py tests/test_diagnosis_viewer_downloader.py tests/test_quicktest_s3_missing.py tests/test_quicktest_download_gui.py tests/test_case_table_quicktest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # PR #75: Nur die sechs Datenbeschaffungs-CLIs und ihre Downloader pruefen.
      # Die uebergreifende GUI-Vollsuite haengt bereits auf main an einem Qt-Dialog.
      - name: Run focused acquisition CLI gate for PR #75
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 75 }}
        shell: pwsh
        run: |
          python -m compileall -q src scripts/diagnosis_viewer_warn_error.py scripts/vedoc_dcdc223_seriennummern.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check src tests ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q --maxfail=1 --tb=short tests/test_acquisition_portal_cli.py tests/test_acquisition_output_paths.py tests/test_acquisition_batch_cli.py tests/test_qec_tool_downloader.py tests/test_tips_writer_downloader.py tests/test_vedoc_dcdc223_seriennummern.py tests/test_diagnosis_viewer_warn_error.py tests/test_vedoc_codes_scraper.py tests/test_diagnosis_viewer_quicktests_cli.py tests/test_diagnosis_viewer_downloader.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import importlib.metadata as m; names = {e.name for e in m.distribution('ntf-insight').entry_points if e.group == 'console_scripts'}; assert {'ntf-insight-vedoc-dcdc223','ntf-insight-wem','ntf-insight-vedoc-codes','ntf-insight-quicktests','ntf-insight-qec','ntf-insight-tips','ntf-insight-beschaffung'} <= names"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # PR #77: QEC-Sachnummer und explizit alle Anhaenge ohne Fallzuordnungsbehauptung.
      # Die allgemeine GUI-Vollsuite ist auf main von einer Qt-Blockade betroffen.
      - name: Run focused QEC Sachnummer and attachments gate for PR #77
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 77 }}
        shell: pwsh
        run: |
          python -m compileall -q src scripts tests/test_qec_attachment_reference.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check src tests ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q --maxfail=1 --tb=short tests/test_qec_attachment_reference.py tests/test_qec_tool_downloader.py tests/test_acquisition_portal_cli.py tests/test_acquisition_batch_cli.py tests/test_qec_archive.py tests/test_qec_json.py tests/test_qec_case_gui.py tests/test_qec_reference_end_findings.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full portable quality gate
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.number != 72 && github.event.pull_request.number != 73 && github.event.pull_request.number != 74 && github.event.pull_request.number != 75 && github.event.pull_request.number != 77) }}
        run: python ci/quality_gate.py

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify packaged legacy and portal CLI modules for PR #75
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 75 }}
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from zipfile import ZipFile; wheel = next(Path('dist').glob('ntf_insight-*.whl')); names = set(ZipFile(wheel).namelist()); required = {'scripts/__init__.py', 'scripts/vedoc_dcdc223_seriennummern.py', 'scripts/diagnosis_viewer_warn_error.py', 'ntf_insight/acquisition/portal_cli.py', 'ntf_insight/acquisition/output_paths.py', 'ntf_insight/acquisition/beschaffung_cli.py'}; assert required.issubset(names), sorted(required - names)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify QEC CLI modules in wheel for PR #77
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 77 }}
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from zipfile import ZipFile; wheel = next(Path('dist').glob('ntf_insight-*.whl')); names = set(ZipFile(wheel).namelist()); assert {'ntf_insight/acquisition/portal_cli.py','ntf_insight/acquisition/qec_tool.py','ntf_insight/acquisition/beschaffung_cli.py'} <= names"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # No artifacts uploaded to GitHub Actions: quota protection.
      # Test summaries remain in Actions logs, wheel built locally in job.
      # Explicitly never upload proprietary QEC/FIN/DTC data.
