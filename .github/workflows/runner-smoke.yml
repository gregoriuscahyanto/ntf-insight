name: NTF Runner Verbindungstest

# Manuell ausgeloest; KEIN push-, pull_request- oder schedule-Trigger.
on:
  workflow_dispatch:

# Kein Zugriff auf GitHub APIs, Repository-Secrets oder Code via GITHUB_TOKEN.
permissions: {}

jobs:
  verbindungstest:
    name: Verbindungstest (${{ matrix.runner_label }})
    # Der Test darf nur bewusst vom Standardbranch angestossen werden.
    if: ${{ github.repository == 'gregoriuscahyanto/ntf-insight' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        runner_label:
          - ntf-insight-1
          - ntf-insight-2
    runs-on: [self-hosted, Windows, X64, "${{ matrix.runner_label }}"]
    timeout-minutes: 3
    steps:
      # Kein checkout, keine Dependencies, keine Auswertung und kein Upload.
      # Der einzige Testbefehl gibt feste, unkritische Strings aus.
      - name: Nur Verbindung bestaetigen
        shell: powershell
        run: |
          Write-Output 'NTF_SELF_HOSTED_RUNNER_OK'
          Write-Output 'Keine lokalen QEC-, FIN-, SSL-, QuickTest- oder Datenbankdateien gelesen.'
