[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntf-insight"
version = "0.1.0"
description = "Component-agnostic analytics for No Trouble Found field cases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "pydantic>=2.8",
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=16",
]

[project.scripts]
ntf-insight = "ntf_insight.app.application:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
