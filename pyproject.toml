[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntf-insight"
version = "0.1.0"
description = "Component-agnostic analytics for No Trouble Found field cases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "pydantic>=2.8",
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=16",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "lxml>=5.0",
  "playwright>=1.55",
  "keyring>=25.0",
]

[project.scripts]
ntf-insight = "ntf_insight.app.application:main"
ntf-insight-import = "ntf_insight.ingestion.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.7",
  "build>=1.2",
  "reportlab>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.setuptools.package-data]
"ntf_insight.smrd" = ["softing_native_export.ps1"]
